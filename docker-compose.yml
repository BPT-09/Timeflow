version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: timemanager-postgres
    restart: always
    environment:
      POSTGRES_DB: timedb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
